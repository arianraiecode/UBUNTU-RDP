
name: Ubuntu-RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install XFCE and XRDP
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            openssl \
            curl \
            netcat-openbsd

          sudo useradd -m -s /bin/bash RDP

          echo "xfce4-session" | sudo tee /home/RDP/.xsession >/dev/null
          sudo chown RDP:RDP /home/RDP/.xsession
          sudo chmod 644 /home/RDP/.xsession

          sudo usermod -aG ssl-cert xrdp
          sudo usermod -aG ssl-cert RDP

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Generate and Set RDP Password
        id: credentials
        shell: bash
        run: |
          set -euo pipefail

          PASSWORD=$(openssl rand -hex 24)

          printf 'RDP:%s\n' "$PASSWORD" | sudo chpasswd

          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

          {
            echo "## Ubuntu RDP Credentials"
            echo ""
            echo "- Username: RDP"
            echo "- Password: \`$PASSWORD\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Tailscale
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled

      - name: Connect Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="gh-ubuntu-${GITHUB_RUN_ID}"

          TS_IP=""

          for i in $(seq 1 30); do
            TS_IP=$(sudo tailscale ip -4 | head -n 1 || true)

            if [ -n "$TS_IP" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Verify XRDP
        shell: bash
        run: |
          set -euo pipefail

          sudo systemctl restart xrdp
          sleep 5

          sudo systemctl is-active --quiet xrdp

          if ! nc -z -w 10 127.0.0.1 3389; then
            echo "XRDP port is not listening"
            sudo journalctl -u xrdp --no-pager -n 50
            exit 1
          fi

          echo "XRDP is ready!"

      - name: Show Connection Details
        shell: bash
        run: |
          {
            echo "## Ubuntu RDP Access"
            echo ""
            echo "- OS: Ubuntu 24.04"
            echo "- Desktop: XFCE"
            echo "- Address: $TAILSCALE_IP"
            echo "- Port: 3389"
            echo "- Username: RDP"
            echo ""
            echo "Password is shown in the previous credentials step."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Runner Alive
        shell: bash
        run: |
          while true; do
            echo "[$(date)] Ubuntu RDP Active"
            sleep 300
          done
