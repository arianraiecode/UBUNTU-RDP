
name: Ubuntu-RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install XFCE Desktop and XRDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            netcat-openbsd

          # Configure XFCE for RDP sessions
          sudo useradd -m -s /bin/bash RDP

          echo "xfce4-session" | sudo tee /home/RDP/.xsession
          sudo chown RDP:RDP /home/RDP/.xsession
          sudo chmod 644 /home/RDP/.xsession

          # Allow XRDP to access its TLS certificate
          sudo usermod -aG ssl-cert RDP

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Set RDP Password
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "RDP_PASSWORD secret is missing"
            exit 1
          fi

          echo "RDP:$RDP_PASSWORD" | sudo chpasswd

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="gh-ubuntu-${GITHUB_RUN_ID}"

          TS_IP=""

          for i in $(seq 1 30); do
            TS_IP=$(sudo tailscale ip -4 | head -n 1)

            if [ -n "$TS_IP" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Verify RDP
        run: |
          sudo systemctl restart xrdp

          sleep 5

          sudo systemctl is-active --quiet xrdp || {
            echo "XRDP service is not running"
            exit 1
          }

          if ! nc -z -w 5 "$TAILSCALE_IP" 3389; then
            echo "RDP port 3389 is not accessible"
            sudo ss -lntp
            exit 1
          fi

          echo "RDP connection is ready!"

      - name: Show Connection Details
        run: |
          echo "## Ubuntu RDP Access" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: Ubuntu 24.04" >> "$GITHUB_STEP_SUMMARY"
          echo "- Desktop: XFCE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Address: $TAILSCALE_IP" >> "$GITHUB_STEP_SUMMARY"
          echo "- Port: 3389" >> "$GITHUB_STEP_SUMMARY"
          echo "- Username: RDP" >> "$GITHUB_STEP_SUMMARY"
          echo "- Password: Set in GitHub Secrets (RDP_PASSWORD)" >> "$GITHUB_STEP_SUMMARY"

          echo "Ubuntu RDP is ready at $TAILSCALE_IP:3389"

      - name: Keep Runner Alive
        run: |
          while true; do
            echo "[$(date)] Ubuntu RDP Active"
            sleep 300
          done
